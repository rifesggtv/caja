<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Caja Registradora - Almacén Solomedias Intimas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Courier+Prime&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .products-container { height: calc(100vh - 300px); }

        /* ESTILOS DE IMPRESIÓN PARA IMPRESORA TÉRMICA */
        @media print {
            body * { visibility: hidden !important; }
            #ticketPrintArea, #ticketPrintArea * { 
                visibility: visible !important; 
                display: block !important;
            }
            #ticketPrintArea {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                max-width: 58mm; /* Ajuste para papel térmico común */
                font-family: 'Courier Prime', monospace;
                font-size: 11px;
                color: black;
                padding: 5px;
            }
            @page { margin: 0; }
        }
    </style>
</head>
<body class="bg-slate-50 h-screen flex flex-col overflow-hidden">

    <!-- Área de Impresión (Invisible en Navegador) -->
    <div id="ticketPrintArea" style="display: none;"></div>

    <!-- Encabezado UI -->
    <header class="bg-blue-600 text-white p-4 shadow-md flex justify-between items-center z-20">
        <div class="flex items-center gap-4">
            <h1 class="text-xl font-bold flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
                </svg>
                Caja Registradora
            </h1>
            <span id="productCounter" class="bg-blue-800 px-3 py-1 rounded-full text-xs font-medium"></span>
        </div>
        <div class="flex gap-2">
            <button id="btnAddProduct" class="bg-green-500 hover:bg-green-400 px-4 py-2 rounded-lg text-sm font-semibold transition flex items-center gap-1 shadow-sm">
                + Añadir Botón
            </button>
            <button id="toggleEdit" class="bg-blue-500 hover:bg-blue-400 px-4 py-2 rounded-lg text-sm font-semibold transition shadow-sm">
                Configurar Botones
            </button>
        </div>
    </header>

    <main class="flex-1 flex overflow-hidden">
        <!-- Sección Izquierda -->
        <div class="flex-1 flex flex-col relative">
            <div class="bg-white p-4 shadow-sm border-b border-slate-200 z-10 space-y-3">
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400">
                        <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
                    </span>
                    <input type="text" id="searchBox" placeholder="Buscar producto por nombre..." class="w-full pl-10 pr-4 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none bg-slate-50">
                </div>
                
                <div class="flex gap-3 items-center bg-slate-100 p-2 rounded-lg">
                    <span class="text-[10px] font-bold text-slate-400 uppercase ml-2">Rápido:</span>
                    <input type="text" id="inputManualName" placeholder="Nombre" class="flex-1 p-2 text-sm border border-slate-300 rounded-lg outline-none">
                    <input type="number" id="inputManualPrice" placeholder="Precio ($)" class="w-32 p-2 text-sm border border-slate-300 rounded-lg outline-none font-bold">
                    <button id="btnManualAdd" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-bold text-sm transition shadow-sm">Añadir</button>
                </div>
            </div>

            <!-- Grilla de Productos -->
            <div class="flex-1 p-6 overflow-y-auto custom-scroll products-container">
                <div id="productsGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-4"></div>
            </div>

            <!-- Panel de Pago -->
            <div class="bg-white p-4 border-t-2 border-slate-200 shadow-[0_-4px_10px_rgba(0,0,0,0.05)] z-20">
                <div class="grid grid-cols-1 md:grid-cols-4 gap-4 items-end max-w-6xl mx-auto">
                    <div class="bg-blue-50 p-2 rounded-lg border border-blue-100">
                        <p class="text-[10px] font-bold text-blue-400 uppercase mb-1">Total Pendiente</p>
                        <p class="text-3xl font-black text-blue-600" id="displayTotal">$0</p>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Monto a abonar:</label>
                        <input type="number" id="inputPago" placeholder="0" class="w-full p-2 border border-slate-300 rounded-lg text-2xl font-bold focus:ring-2 focus:ring-blue-500 outline-none bg-yellow-50">
                    </div>
                    <div>
                        <p class="text-[10px] font-bold text-slate-500 uppercase mb-1">Vueltas / Cambio:</p>
                        <p class="text-3xl font-black text-green-600" id="displayCambio">$0</p>
                    </div>
                    <div class="flex flex-col gap-2">
                        <input type="datetime-local" id="manualDateTime" class="w-full p-2 border border-slate-200 rounded text-[10px] bg-slate-50">
                        <div class="grid grid-cols-2 gap-2">
                            <button onclick="handlePayment('Efectivo')" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 rounded-xl text-xs shadow-md transition transform active:scale-95">💵 Efectivo</button>
                            <button onclick="handlePayment('Tarjeta')" class="bg-purple-600 hover:bg-purple-700 text-white font-bold py-2 rounded-xl text-xs shadow-md transition transform active:scale-95">💳 Tarjeta</button>
                        </div>
                    </div>
                </div>
                <div class="mt-4 flex flex-col items-center gap-2">
                    <div class="flex items-center gap-4">
                        <button id="btnLimpiar" class="bg-red-100 hover:bg-red-600 text-red-600 hover:text-white px-8 py-2 rounded-full text-xs font-bold uppercase tracking-widest transition-all shadow-sm border border-red-200">
                            ❌ Cancelar Venta
                        </button>
                        <label class="flex items-center gap-2 text-xs font-bold text-slate-500 cursor-pointer">
                            <input type="checkbox" id="autoPrint" checked class="w-4 h-4 rounded text-blue-600">
                            Imprimir Recibo
                        </label>
                    </div>
                    <span id="paymentStatus" class="text-[10px] font-bold text-orange-500 uppercase italic hidden">Pago parcial iniciado...</span>
                </div>
            </div>
        </div>

        <!-- Barra Lateral -->
        <aside class="w-80 bg-white border-l border-slate-200 flex flex-col z-30">
            <div class="p-4 border-b border-slate-100 h-1/3 flex flex-col overflow-hidden">
                <h2 class="font-bold text-slate-700 mb-2 flex items-center gap-2">Carrito</h2>
                <div id="cartItems" class="flex-1 overflow-y-auto custom-scroll space-y-2"></div>
            </div>

            <div class="p-4 flex-1 border-t border-slate-100 bg-slate-50 flex flex-col overflow-hidden">
                <div class="flex justify-between items-center mb-1">
                    <h2 class="font-bold text-slate-700 text-[11px] uppercase tracking-tight">📜 Historial</h2>
                    <div class="flex gap-2">
                        <button id="btnExportPDF" class="text-blue-500 hover:text-blue-700"><svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg></button>
                        <button id="btnClearHistory" class="text-red-400 hover:text-red-600"><svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg></button>
                    </div>
                </div>
                <div class="bg-blue-100 p-2 rounded-lg mb-2 flex justify-between items-center border border-blue-200">
                    <span class="text-[10px] font-bold text-blue-700">Venta Total:</span>
                    <span id="historyTotalSum" class="font-black text-blue-800 text-sm">$0</span>
                </div>
                <div id="salesHistory" class="flex-1 overflow-y-auto custom-scroll space-y-3 text-[10px]"></div>
            </div>
        </aside>
    </main>

    <!-- Modal Editar -->
    <div id="configModal" class="fixed inset-0 bg-black/50 flex items-center justify-center hidden z-50">
        <div class="bg-white p-6 rounded-2xl shadow-2xl w-80">
            <h3 class="text-xl font-bold mb-4">Editar Producto</h3>
            <div class="space-y-4">
                <input type="text" id="editName" placeholder="Nombre" class="w-full p-2 border rounded-lg">
                <input type="number" id="editPrice" placeholder="Precio" class="w-full p-2 border rounded-lg">
            </div>
            <div class="mt-6 flex flex-col gap-2">
                <button id="saveConfig" class="bg-blue-600 text-white py-2 rounded-lg font-bold">Guardar</button>
                <button id="deleteProduct" class="text-red-600 text-sm">Eliminar botón</button>
                <button id="closeModal" class="text-slate-400 text-sm">Cancelar</button>
            </div>
        </div>
    </div>

    <script>
        let products = JSON.parse(localStorage.getItem('pos_products')) || [{ id: 1, name: "Producto Base", price: 1000 }];
        let rawHistory = JSON.parse(localStorage.getItem('pos_history')) || [];
        let history = rawHistory.filter(h => h && h.total !== undefined);
        let cart = [];
        let payments = []; 
        let isEditMode = false;
        let editingId = null;

        const formatMoney = (v) => {
            const val = parseFloat(v) || 0;
            return new Intl.NumberFormat('es-CO', { style: 'currency', currency: 'COP', maximumFractionDigits: 0 }).format(val);
        };

        // --- FUNCIÓN DE IMPRESIÓN CORREGIDA ---
        function printTicket(saleData) {
            const ticketArea = document.getElementById('ticketPrintArea');
            const line = "-".repeat(30);
            
            // Generar detalle de productos
            const itemsHTML = saleData.items.map(it => `
                <div style="display:flex; justify-content:space-between; margin-bottom: 2px;">
                    <span style="flex:1;">${it.name.substring(0,20)}</span>
                    <span style="margin-left:5px;">${formatMoney(it.price)}</span>
                </div>
            `).join('');

            // Generar detalle de pagos
            const pagosHTML = Object.entries(saleData.pagos).map(([metodo, monto]) => `
                <div style="display:flex; justify-content:space-between;">
                    <span>${metodo}:</span>
                    <span>${formatMoney(monto)}</span>
                </div>
            `).join('');

            // Estructura final del ticket con los textos solicitados
            ticketArea.innerHTML = `
                <div style="text-align: center; margin-bottom: 5px;">
                    <strong style="font-size: 14px;">ALMACEN SOLOMEDIAS INTIMAS</strong><br>
                    <span>RECIBO DE VENTA</span><br>
                    <span style="font-size: 9px;">${saleData.fechaFull}</span><br>
                    <span style="font-size: 9px;">ID: #${saleData.id.toString().slice(-6)}</span>
                </div>
                <div>${line}</div>
                <div style="margin: 5px 0;">
                    ${itemsHTML}
                </div>
                <div>${line}</div>
                <div style="display:flex; justify-content:space-between; font-weight: bold; font-size: 13px;">
                    <span>TOTAL:</span>
                    <span>${formatMoney(saleData.total)}</span>
                </div>
                <div style="margin-top: 5px;">
                    <div style="font-size: 10px;">PAGADO CON:</div>
                    ${pagosHTML}
                </div>
                <div>${line}</div>
                <div style="text-align: center; margin-top: 10px; font-size: 10px;">
                    <strong>GRACIAS POR SU COMPRA</strong><br><br>
                    <span>ROPA INTERIOR, BODYS Y MEDIAS NO TIENEN CAMBIO</span><br><br>
                    <strong>REGIMEN SIMPLIFICADO</strong>
                </div>
                <div style="height: 40px;"></div>
            `;

            // Forzar renderizado y disparar impresión
            ticketArea.style.display = 'block';
            setTimeout(() => {
                window.print();
                ticketArea.style.display = 'none';
            }, 100);
        }

        // --- LÓGICA DE NEGOCIO ---
        function saveProducts() { localStorage.setItem('pos_products', JSON.stringify(products)); }

        function renderProducts(filter = "") {
            const productsGrid = document.getElementById('productsGrid');
            productsGrid.innerHTML = '';
            const filtered = products.filter(p => p.name.toLowerCase().includes(filter.toLowerCase()));
            filtered.forEach(p => {
                const btn = document.createElement('button');
                btn.className = `p-4 h-24 rounded-xl border-2 flex flex-col items-center justify-center gap-1 transition shadow-sm w-full ${isEditMode ? 'border-orange-400 bg-orange-50 animate-pulse' : 'bg-white border-transparent hover:border-blue-500 hover:shadow-md'}`;
                btn.innerHTML = `<span class="font-bold text-slate-700 text-[11px] text-center line-clamp-2 leading-tight">${p.name}</span><span class="text-blue-600 font-bold text-[10px]">${formatMoney(p.price)}</span>`;
                btn.onclick = () => isEditMode ? openConfig(p.id) : addToCart(p);
                productsGrid.appendChild(btn);
            });
            document.getElementById('productCounter').innerText = `${products.length} Botones`;
        }

        document.getElementById('searchBox').addEventListener('input', (e) => renderProducts(e.target.value));

        function addToCart(p) {
            cart.push({...p, cartId: Date.now() + Math.random()});
            updateUI();
        }

        function removeFromCart(cartId) {
            cart = cart.filter(item => item.cartId !== cartId);
            updateUI();
        }

        function updateUI() {
            const cartItems = document.getElementById('cartItems');
            if (cart.length === 0) {
                cartItems.innerHTML = '<p class="text-slate-400 text-center text-xs mt-4 italic">Carrito vacío</p>';
                document.getElementById('paymentStatus').classList.add('hidden');
            } else {
                cartItems.innerHTML = cart.map(item => `
                    <div class="flex justify-between items-center bg-white p-2 rounded border border-slate-200 text-[11px] shadow-sm">
                        <div class="flex flex-col truncate flex-1 pr-2">
                            <span class="font-bold truncate">${item.name}</span>
                            <span class="text-blue-500 font-medium">${formatMoney(item.price)}</span>
                        </div>
                        <button onclick="removeFromCart(${item.cartId})" class="text-red-400 hover:text-red-600 p-1 bg-red-50 rounded">✕</button>
                    </div>
                `).join('');
            }

            const cartTotal = cart.reduce((s, i) => s + (parseFloat(i.price) || 0), 0);
            const totalYaPagado = payments.reduce((s, p) => s + (parseFloat(p.amount) || 0), 0);
            const pendiente = Math.max(0, cartTotal - totalYaPagado);
            
            document.getElementById('displayTotal').innerText = formatMoney(pendiente);
            const montoAbono = parseFloat(document.getElementById('inputPago').value) || 0;
            document.getElementById('displayCambio').innerText = formatMoney(Math.max(0, montoAbono - pendiente));

            if (payments.length > 0) document.getElementById('paymentStatus').classList.remove('hidden');
            else document.getElementById('paymentStatus').classList.add('hidden');
        }

        function handlePayment(method) {
            if (cart.length === 0) return;
            const cartTotal = cart.reduce((s, i) => s + (parseFloat(i.price) || 0), 0);
            const totalYaPagado = payments.reduce((s, p) => s + (parseFloat(p.amount) || 0), 0);
            const pendiente = cartTotal - totalYaPagado;
            let montoInput = parseFloat(document.getElementById('inputPago').value) || 0;
            if (montoInput === 0) montoInput = pendiente;
            const montoRealAAbonar = Math.min(montoInput, pendiente);

            payments.push({ amount: montoRealAAbonar, method: method });
            if (payments.reduce((s, p) => s + (parseFloat(p.amount) || 0), 0) >= cartTotal - 0.01) finalizeSale();
            else { document.getElementById('inputPago').value = ''; updateUI(); }
        }

        function finalizeSale() {
            const manualDateVal = document.getElementById('manualDateTime').value;
            const fechaObj = manualDateVal ? new Date(manualDateVal) : new Date();
            const timestamp = fechaObj.toLocaleString();
            const timeStr = fechaObj.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const cartTotal = cart.reduce((s, i) => s + (parseFloat(i.price) || 0), 0);
            const itemsDetalle = cart.map(i => ({ name: i.name, price: i.price }));
            const resumenPagos = {};
            payments.forEach(p => resumenPagos[p.method] = (resumenPagos[p.method] || 0) + p.amount);

            const newEntry = {
                id: Date.now(),
                items: itemsDetalle,
                total: cartTotal,
                pagos: resumenPagos,
                fechaFull: timestamp,
                fechaCorta: timeStr
            };

            history = [newEntry, ...history];
            localStorage.setItem('pos_history', JSON.stringify(history.slice(0, 1000)));
            
            if(document.getElementById('autoPrint').checked) {
                printTicket(newEntry);
            }

            cart = []; payments = []; document.getElementById('inputPago').value = '';
            document.getElementById('manualDateTime').value = '';
            document.getElementById('searchBox').value = '';
            updateUI(); renderHistory(); renderProducts();
        }

        function renderHistory() {
            const salesHistory = document.getElementById('salesHistory');
            if (history.length === 0) {
                salesHistory.innerHTML = '<p class="text-center text-slate-400 mt-2">Sin registros</p>';
                document.getElementById('historyTotalSum').innerText = formatMoney(0);
                return;
            }
            const totalSum = history.reduce((s, h) => s + (parseFloat(h.total) || 0), 0);
            document.getElementById('historyTotalSum').innerText = formatMoney(totalSum);

            salesHistory.innerHTML = history.map(v => {
                const pagos = v.pagos || {};
                const itemsHTML = v.items.map(it => `
                    <div class="flex justify-between items-center text-[9px] text-slate-500 py-0.5 border-b border-slate-50 last:border-0">
                        <span class="truncate pr-2">• ${it.name}</span>
                        <span>${formatMoney(it.price)}</span>
                    </div>
                `).join('');

                return `
                <div class="bg-white p-3 rounded-lg border border-slate-200 shadow-sm flex flex-col gap-2">
                    <div class="flex justify-between items-center pb-2 border-b border-slate-100">
                        <span class="text-[9px] font-bold text-slate-400 uppercase">${v.fechaCorta} - #${v.id.toString().slice(-4)}</span>
                        <div class="flex gap-2">
                            <button onclick='reprintTicket(${JSON.stringify(v)})' class="text-blue-400 hover:text-blue-600">🖨️</button>
                            <button onclick="removeHistoryItem(${v.id})" class="text-slate-300 hover:text-red-500">✕</button>
                        </div>
                    </div>
                    <div class="space-y-0.5">${itemsHTML}</div>
                    <div class="flex justify-between items-end mt-1">
                        <div class="text-[8px] font-bold uppercase text-blue-500">${Object.keys(pagos).join('/')}</div>
                        <div class="text-right"><p class="font-black text-slate-900 text-sm leading-tight">${formatMoney(v.total)}</p></div>
                    </div>
                </div>`;
            }).join('');
        }

        function reprintTicket(sale) { printTicket(sale); }

        function removeHistoryItem(id) {
            if(confirm("¿Eliminar registro?")) {
                history = history.filter(h => h.id !== id);
                localStorage.setItem('pos_history', JSON.stringify(history));
                renderHistory();
            }
        }

        document.getElementById('btnManualAdd').onclick = () => {
            const price = parseFloat(document.getElementById('inputManualPrice').value);
            const name = document.getElementById('inputManualName').value || "Venta Rápida";
            if (price > 0) {
                addToCart({ name, price });
                document.getElementById('inputManualPrice').value = '';
                document.getElementById('inputManualName').value = '';
            }
        };

        document.getElementById('toggleEdit').onclick = () => {
            isEditMode = !isEditMode;
            document.getElementById('toggleEdit').innerText = isEditMode ? "Salir" : "Configurar Botones";
            renderProducts();
        };

        document.getElementById('btnAddProduct').onclick = () => {
            const newP = { id: Date.now(), name: "Nuevo Botón", price: 0 };
            products.push(newP);
            saveProducts();
            renderProducts();
            openConfig(newP.id);
        };

        function openConfig(id) {
            editingId = id;
            const p = products.find(x => x.id === id);
            document.getElementById('editName').value = p.name;
            document.getElementById('editPrice').value = p.price;
            document.getElementById('configModal').classList.remove('hidden');
        }

        document.getElementById('saveConfig').onclick = () => {
            const name = document.getElementById('editName').value;
            const price = parseFloat(document.getElementById('editPrice').value) || 0;
            products = products.map(p => p.id === editingId ? { ...p, name, price } : p);
            saveProducts();
            document.getElementById('configModal').classList.add('hidden');
            renderProducts();
        };

        document.getElementById('deleteProduct').onclick = () => {
            products = products.filter(p => p.id !== editingId);
            saveProducts();
            document.getElementById('configModal').classList.add('hidden');
            renderProducts();
        };

        document.getElementById('closeModal').onclick = () => document.getElementById('configModal').classList.add('hidden');
        document.getElementById('btnLimpiar').onclick = () => { 
            if (cart.length === 0) return;
            if(payments.length > 0 && !confirm("Hay un pago parcial iniciado. ¿Seguro que quieres cancelar?")) return;
            cart = []; payments = []; updateUI(); 
        };
        document.getElementById('inputPago').oninput = updateUI;

        document.getElementById('btnClearHistory').onclick = () => {
            if(confirm("¿Borrar todo el historial?")) {
                history = [];
                localStorage.setItem('pos_history', JSON.stringify([]));
                renderHistory();
            }
        };

        document.getElementById('btnExportPDF').onclick = () => {
            if (history.length === 0) return;
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.text("Reporte de Ventas", 14, 15);
            const rows = history.map(v => [v.fechaFull, v.items.map(it => it.name).join(', '), formatMoney(v.total)]);
            doc.autoTable({ head: [['Fecha', 'Productos', 'Total']], body: rows, startY: 25 });
            doc.save(`cuadre-${new Date().toLocaleDateString()}.pdf`);
        };

        renderProducts();
        renderHistory();
        updateUI();
    </script>
</body>
</html>
